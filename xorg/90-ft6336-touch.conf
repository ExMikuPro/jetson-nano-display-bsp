Section "InputClass"
    Identifier "FT6336U touchscreen"
    MatchIsTouchscreen "on"
    MatchProduct "EP0110M09"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    # Five-point evtest result plus the requested reflection along the
    # landscape panel's long edge: screen X = 1 - raw Y;
    # screen Y = 1 - raw X.
    Option "CalibrationMatrix" "0 -1 1 -1 0 1 0 0 1"
EndSection
