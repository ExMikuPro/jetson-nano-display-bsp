Section "InputClass"
    Identifier "FT6336U touchscreen"
    MatchIsTouchscreen "on"
    MatchProduct "EP0110M09"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    # Five-point evtest result for the 90-degree landscape framebuffer:
    # screen X = raw Y; screen Y = 1 - raw X.
    Option "CalibrationMatrix" "0 1 0 -1 0 1 0 0 1"
EndSection
