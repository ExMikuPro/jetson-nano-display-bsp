Section "InputClass"
    Identifier "FT6336U touchscreen"
    MatchIsTouchscreen "on"
    MatchProduct "EP0110M09"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    # Five-point evtest result, followed by the panel's X/Y mirror settings:
    # screen X = 1 - raw Y; screen Y = raw X.
    Option "CalibrationMatrix" "0 -1 1 1 0 0 0 0 1"
EndSection
