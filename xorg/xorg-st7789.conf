Section "ServerLayout"
    Identifier "ST7789V Layout"
    Screen 0 "ST7789V Screen"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "AutoBindGPU" "false"
EndSection

Section "Device"
    Identifier "ST7789V fbdev"
    Driver "fbdev"
    Option "fbdev" "/dev/fb1"
    Option "ShadowFB" "true"
EndSection

Section "Monitor"
    Identifier "ST7789V Monitor"
EndSection

Section "Screen"
    Identifier "ST7789V Screen"
    Device "ST7789V fbdev"
    Monitor "ST7789V Monitor"
    DefaultDepth 16
    SubSection "Display"
        Depth 16
        Modes "320x240"
    EndSubSection
EndSection

